[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfrc2g"
version = "2.2.0"  # keep in sync with pyfrc2g/__init__.py
description = "Firewall rules to flow graphs, audit and compliance reports (pfSense, OPNsense, FortiGate, iptables, nftables, Stormshield)"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "PyFRC2G Contributors" }
]
keywords = ["firewall", "pfsense", "opnsense", "fortigate", "iptables", "nftables", "stormshield", "graph", "flow", "audit", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking :: Firewalls",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.9"
dependencies = [
    "requests>=2.25.0",
    "graphviz>=0.16",
    "reportlab>=3.6.0",
    "pypdf>=3.9",
    "openpyxl>=3.0",
    "pyyaml>=5.1",
    "defusedxml>=0.7",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/olivierb46/PyFRC2G"
Documentation = "https://github.com/olivierb46/PyFRC2G/blob/main/README.md"
Repository = "https://github.com/olivierb46/PyFRC2G"

[project.scripts]
pyfrc2g = "pyfrc2g.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfrc2g*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
