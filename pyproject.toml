[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfrc2g"
version = "2.0.0"
description = "Unified Firewall Rules to Graph Converter for pfSense and OPNSense"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "PyFRC2G Contributors" }
]
keywords = ["firewall", "pfsense", "opnsense", "graph", "flow", "compliance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking :: Firewalls",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.25.0",
    "graphviz>=0.16",
    "reportlab>=3.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/PyFRC2G"
Documentation = "https://github.com/yourusername/PyFRC2G#readme"
Repository = "https://github.com/yourusername/PyFRC2G"

[project.scripts]
pyfrc2g = "pyfrc2g.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfrc2g*"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
