[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfrc2g-web"
version = "1.3.0"  # keep in sync with pyfrc2g_web/__init__.py
description = "Web application for PyFRC2G: firewall rules dashboard, audit, graphs and reports, encrypted storage"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "PyFRC2G Contributors" }]
keywords = ["firewall", "pfsense", "opnsense", "fortigate", "audit", "compliance", "flask"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: System Administrators",
    "Topic :: System :: Networking :: Firewalls",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
requires-python = ">=3.9"
# The web application is run with Docker (see README.md); this file describes the package the image mounts.
# The PyFRC2G engine is in ../engine (not on PyPI).
dependencies = [
    "pyfrc2g>=2.3.0",
    "flask>=2.2",
    "cryptography>=41",
    "waitress>=2.1",
    "markdown>=3.4",
    "segno>=1.5",
]

[project.optional-dependencies]
oidc = ["flask-oidc>=2.2", "Flask-Session>=0.8", "redis>=5"]
dev = ["ruff>=0.1.0", "pytest>=7", "fakeredis>=2"]

[project.scripts]
pyfrc2g-web = "pyfrc2g_web.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pyfrc2g_web*"]

[tool.setuptools.package-data]
"pyfrc2g_web" = ["templates/*.html", "templates/admin/*.html", "static/*", "docs/*.md"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
